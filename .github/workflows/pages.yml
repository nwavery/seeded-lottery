# Publishes the page to GitHub Pages, and refreshes the jackpots once a day.
#
# Visitors never fetch anything from the lottery sites: they load jackpots.js, which this workflow rewrites.
# Both games post their new estimates overnight (Powerball draws Mon/Wed/Sat 10:59 PM ET, Mega Millions
# Tue/Fri 11 PM ET), so one run a day after that catches every draw.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:23 UTC is 6:23 AM EDT / 5:23 AM EST. Off the hour, because the top of the hour is when GitHub
    # delays or drops scheduled runs; a late start is fine here.
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions: {}

# One run at a time, so a scheduled refresh and a push can't race each other's commit or deploy. queue: max
# keeps every waiting run; the default keeps only the newest, so a push could cancel the day's refresh.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    # Only main is published. A manual run from another branch would otherwise commit on that branch and
    # rebase it, whole, onto main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write   # to commit the refreshed jackpots.js
      pages: read       # configure-pages reads the site's settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fetch_failed: ${{ steps.fetch.outputs.failed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test
        run: node --test

      # Push runs publish what was pushed; only scheduled and manual runs go to the lottery sites.
      # A failed fetch still writes jackpots.js, keeping each game's last good figures, so carry on and
      # publish, then fail the run at the end so it shows red.
      - name: Fetch jackpots
        id: fetch
        if: github.event_name != 'push'
        run: |
          if node fetch-jackpots.js; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit jackpots
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- jackpots.js; then
            echo "jackpots.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jackpots.js
          git commit -m "Refresh jackpots"
          # Someone may have pushed since checkout; jackpots.js is only ever written here, so a rebase is clean.
          git pull --rebase origin main
          git push origin HEAD:main

      # Only the files the page loads. Tests, fixtures and the fetch script stay out of the site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html prng.js roi.js jackpots.js _site/

      # The versions GitHub's Pages documentation pairs together.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Report a failed fetch
        if: needs.build.outputs.fetch_failed == '1'
        run: |
          echo "::error::A jackpot fetch failed; the site kept the last good figures. See the build job's Fetch jackpots step."
          exit 1
